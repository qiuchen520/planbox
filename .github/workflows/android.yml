name: Build APK
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android platform (keep our lib/ and pubspec)
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create --org top --project-name planbox --platforms=android .
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          sed -i 's/android:label="planbox"/android:label="计划盒"/' android/app/src/main/AndroidManifest.xml || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking for now)
        continue-on-error: true
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Sign APK with fixed keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 Secret KEYSTORE_B64，拒绝用其他钥匙签名"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/planbox.jks
          test -s /tmp/planbox.jks || { echo "::error::签名库解码失败"; exit 1; }
          echo "已从 Secret 载入签名库（$(wc -c < /tmp/planbox.jks) 字节）"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "apksigner: $BT/apksigner"
          for f in build/app/outputs/flutter-apk/*.apk; do
            "$BT/apksigner" sign \
              --ks /tmp/planbox.jks \
              --ks-key-alias planbox \
              --ks-pass pass:planbox2026 \
              --key-pass pass:planbox2026 \
              --out "${f%.apk}-signed.apk" "$f"
            mv "${f%.apk}-signed.apk" "$f"
            "$BT/apksigner" verify --print-certs "$f" | head -3 || true
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: planbox-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases (tag or main)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.4.7-build{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Dev build {0} · v0.4.7', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true