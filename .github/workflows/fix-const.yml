name: Fix const color
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Drop const on dynamic theme color
        run: |
          echo "--- before ---"
          grep -nE 'const Icon\([^)]*color: kAcc' lib/pages/tasks_page.dart || true
          sed -i -E 's/const (Icon\([^)]*color: kAcc\))/\1/g' lib/pages/tasks_page.dart
          echo "--- after ---"
          sed -n '482p' lib/pages/tasks_page.dart
          if grep -nE 'const [A-Za-z]+\([^)]*kAcc' lib/pages/tasks_page.dart lib/pages/today_page.dart lib/pages/timetable_page.dart; then
            echo "::error::还有 const 上下文引用 kAcc"
            exit 1
          fi
          echo "OK"

      - name: Commit and push
        run: |
          git config user.name "qiuchen520"
          git config user.email "2190462784@qq.com"
          git rm -q .github/workflows/fix-const.yml
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要提交的改动"
          else
            git commit -m "fix(v0.4): tasks_page 去掉 const Icon 中引用的动态主题色"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Dispatch APK build
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/qiuchen520/planbox/actions/workflows/android.yml/dispatches \
            -d '{"ref":"main"}' \
            -w '\nHTTP %{http_code}\n'
