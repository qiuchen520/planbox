name: planbox
description: "PlanBox（计划盒）— 离线优先的学生计划工具：课表 / 作业 / 打卡 / 番茄钟。"
publish_to: 'none'
version: 0.9.1+33
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  # 通知：本地通知 + 时区（时区由 Dart 侧按偏移量推断，不依赖原生插件）
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  # 备份：分享导出 + 选择文件导入
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  # 番茄钟：循环播放本地生成的白噪音
  just_audio: ^0.9.42
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

# file_picker 8.x 自己按 compileSdk 34 编译，但新版 flutter_plugin_android_lifecycle
# 的 aar 元数据要求 compileSdk 36，直接构建会被 checkAarMetadata 拦下。
# 钉回 2.0.20（要求 34），给 file_picker 留出匹配的编译级别。
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.20
